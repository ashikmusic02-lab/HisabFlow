name: Build Android APK and AAB (Play Store)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Ensure .env file exists
        run: touch .env

      - name: Generate Debug and Release Keystores
        run: |
          echo "Setting environment variables..."
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android" >> $GITHUB_ENV

          echo "Generating debug keystore with androiddebugkey alias..."
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"
          cp debug.keystore app/debug.keystore

          echo "Generating upload keystore with upload alias..."
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=HisabFlow, OU=Mobile, O=HisabFlow, L=Dhaka, ST=Dhaka, C=BD"
          cp my-upload-key.jks app/my-upload-key.jks

      - name: Build Android APKs & Google Play AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          ./gradlew assembleDebug assembleRelease bundleRelease -x test -x lint -x lintVitalRelease --stacktrace

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HisabFlow-APKs
          path: app/build/outputs/apk/**/*.apk

      - name: Upload AAB (Play Store Bundle) as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HisabFlow-PlayStore-AAB
          path: app/build/outputs/bundle/**/*.aab
